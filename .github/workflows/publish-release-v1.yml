name: Publish Release v1.0.0

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and prepare assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release_assets
          cd release_assets

          echo "Downloading base multiplatform assets..."
          gh release download v1.5.0 -R Mahmud0808/TeleDrive

          # Rename all 1.5.0 to 1.0.0
          for f in *1.5.0*; do
            newname=$(echo "$f" | sed 's/1\.5\.0/1.0.0/g')
            mv "$f" "$newname"
          done

          echo "Downloading latest universal build artifacts with Spanish support..."
          gh run download 41599068301 -R Mahmud0808/TeleDrive -n TeleDrive-android --dir ./latest-android || true
          gh run download 41599068301 -R Mahmud0808/TeleDrive -n TeleDrive-windows --dir ./latest-windows || true

          if [ -f "./latest-android/TeleDrive-1.5.0-universal-debug.apk" ]; then
            echo "Replacing universal APK with latest build containing Spanish..."
            cp ./latest-android/TeleDrive-1.5.0-universal-debug.apk ./TeleDrive-1.0.0-universal-release.apk
          fi

          if [ -f "./latest-windows/TeleDrive CI-1.5.0.msi" ]; then
            echo "Replacing Windows MSI with latest build containing Spanish..."
            cp "./latest-windows/TeleDrive CI-1.5.0.msi" "./TeleDrive-1.0.0.msi"
          fi

          rm -rf ./latest-android ./latest-windows

          echo "Final list of assets to upload:"
          ls -la

          echo "Creating Release v1.0.0..."
          gh release create v1.0.0 * \
            --title "TeleDrive v1.0.0 - Español (Latinoamérica)" \
            --notes "### 🎉 Primer lanzamiento de TeleDrive v1.0.0 (Español Latinoamérica)

TeleDrive convierte un canal privado de Telegram en tu propio disco duro en la nube sin límites.

#### 📦 Archivos descargables:
* **Android:**
  * \`TeleDrive-1.0.0-arm64-v8a-release.apk\` (Recomendado para celulares modernos)
  * \`TeleDrive-1.0.0-universal-release.apk\` (Compatible con todos los celulares)
  * \`TeleDrive-1.0.0-armeabi-v7a-release.apk\` (Celulares de 32 bits)
  * \`TeleDrive-1.0.0-x86-release.apk\` / \`TeleDrive-1.0.0-x86_64-release.apk\` (Emuladores)
* **Computadora:**
  * \`TeleDrive-1.0.0.msi\` (Instalador para Windows 10/11)
  * \`TeleDrive-1.0.0-x86_64.AppImage\` (Linux portable)
  * \`teledrive_1.0.0_amd64.deb\` (Debian / Ubuntu)
  * \`TeleDrive-1.0.0.dmg\` (macOS Apple Silicon)

#### ✨ Características destacadas:
- Soporte e interfaz adaptada a **Español (Latinoamérica)**.
- Almacenamiento ilimitado respaldado por la nube de Telegram.
- Cifrado de extremo a extremo (E2E) opcional.
- Reproductor multimedia integrado y visor de documentos."
